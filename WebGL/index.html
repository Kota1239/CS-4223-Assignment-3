<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1.0">
  <title>Unity Web Player | {{{ PRODUCT_NAME }}}</title>

  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    /* FIX: center using a wrapper instead of position:fixed on the canvas */
    #unity-wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #unity-canvas { display: block; background: #000; }
  </style>
</head>

<body>
  <!-- FIX: wrapper is what centers the canvas -->
  <div id="unity-wrapper">
    <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
  </div>

  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const ASPECT = 16 / 9;

    function fitCanvas() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      // Largest 16:9 rect that fits in the viewport (no cropping)
      let w = vw;
      let h = vw / ASPECT;
      if (h > vh) { h = vh; w = vh * ASPECT; }

      canvas.style.width  = Math.floor(w) + "px";
      canvas.style.height = Math.floor(h) + "px";
    }

    window.addEventListener("resize", fitCanvas);
    fitCanvas();

    // --- ORIGINAL (MOBILE) CODE (BROKEN FOR YOUR DESIRED BEHAVIOR) ---
    // canvas.style.width = "100%";
    // canvas.style.height = "100%";
    // canvas.style.position = "fixed";
    // canvas.style.right = "0"; // (your workaround) centers only because it offsets a fixed full-viewport element

    // --- FIX: do NOT use position:fixed + 100% sizing if you want centered 16:9 box ---
    // If you want mobile "fill screen" behavior, keep it, but it is fullscreen by definition.

    createUnityInstance(canvas, {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      // matchWebGLToCanvasSize: true (default) is fine here
    }).catch(alert);
  </script>
</body>
</html>
